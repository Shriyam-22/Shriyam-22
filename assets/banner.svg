<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A14"/>
      <stop offset="1" stop-color="#0E1226"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E8E6FF"/>
      <stop offset="1" stop-color="#9D8FFF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C6CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C6FF3D" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C6FF3D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="20"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace}
      .sans{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
      .node{fill:#C6FF3D}
      .n1{animation:pulse 2.6s ease-in-out infinite}
      .n2{animation:pulse 2.6s ease-in-out .6s infinite}
      .n3{animation:pulse 2.6s ease-in-out 1.2s infinite}
      .n4{animation:pulse 2.6s ease-in-out 1.8s infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .edge{stroke:#9D8FFF;stroke-opacity:.35;stroke-width:1.2;stroke-dasharray:4 6;animation:flow 3s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-40}}
      .scan{animation:scan 6s ease-in-out infinite}
      @keyframes scan{0%{transform:translateX(-200px)}100%{transform:translateX(1300px)}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .float{animation:float 7s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="980" cy="60" r="260" fill="url(#glowA)"/>
    <circle cx="1120" cy="320" r="200" fill="url(#glowB)"/>

    <!-- scanning beam -->
    <g class="scan"><rect x="0" y="0" width="120" height="340" fill="#9D8FFF" opacity="0.05"/></g>

    <!-- neural graph -->
    <g class="float">
      <line class="edge" x1="840" y1="90"  x2="960" y2="150"/>
      <line class="edge" x1="840" y1="90"  x2="960" y2="250"/>
      <line class="edge" x1="840" y1="200" x2="960" y2="150"/>
      <line class="edge" x1="840" y1="200" x2="960" y2="250"/>
      <line class="edge" x1="840" y1="290" x2="960" y2="250"/>
      <line class="edge" x1="840" y1="290" x2="960" y2="150"/>
      <line class="edge" x1="960" y1="150" x2="1080" y2="200"/>
      <line class="edge" x1="960" y1="250" x2="1080" y2="200"/>
      <circle class="node n1" cx="840"  cy="90"  r="6"/>
      <circle class="node n2" cx="840"  cy="200" r="6"/>
      <circle class="node n3" cx="840"  cy="290" r="6"/>
      <circle class="node n4" cx="960"  cy="150" r="8"/>
      <circle class="node n1" cx="960"  cy="250" r="8"/>
      <circle cx="1080" cy="200" r="14" fill="none" stroke="#C6FF3D" stroke-width="2"/>
      <circle class="node n3" cx="1080" cy="200" r="6"/>
      <text x="1080" y="236" text-anchor="middle" class="mono" font-size="11" fill="#C6FF3D" fill-opacity=".8">output</text>
    </g>

    <!-- label -->
    <rect x="64" y="58" width="196" height="28" rx="14" fill="#C6FF3D" fill-opacity=".1" stroke="#C6FF3D" stroke-opacity=".45"/>
    <circle cx="82" cy="72" r="4" fill="#C6FF3D" class="n1"/>
    <text x="94" y="77" class="mono" font-size="12.5" fill="#C6FF3D" letter-spacing="1.5">OPEN TO BUILD</text>

    <!-- name -->
    <text x="62" y="160" class="sans" font-size="76" font-weight="800" fill="url(#name)" letter-spacing="-2">Shriyam</text>
    <text x="64" y="204" class="sans" font-size="26" font-weight="500" fill="#C9CDE0">AI Engineer <tspan fill="#5A6080">/</tspan> Software Developer</text>

    <!-- terminal line -->
    <text x="64" y="262" class="mono" font-size="16" fill="#7D84A6"><tspan fill="#C6FF3D">❯</tspan> building agents that are <tspan fill="#FFFFFF">measured</tspan>, not guessed<tspan class="cursor" fill="#C6FF3D">▍</tspan></text>

    <text x="64" y="300" class="mono" font-size="12" fill="#4D5374" letter-spacing="1">LLM AGENTS · EVALS · RETRIEVAL · ML · FULL-STACK</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
